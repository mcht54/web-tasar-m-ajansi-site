# Aşama 1 (sertifikadan önce): yalnızca webtasarimajansi.net — ACME doğrulaması.
# Diğer sitelerin (ör. pazar.mchttasarim.com.tr) server block'larına dokunmaz.
server {
    listen 80;
    listen [::]:80;
    server_name webtasarimajansi.net www.webtasarimajansi.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/webtasarimajansi-acme; default_type text/plain; }
    location / { return 404; }
}
