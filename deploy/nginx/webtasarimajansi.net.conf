# webtasarimajansi.net — yalnızca bu alan adına ait server block'lar.
# Uygulama: 127.0.0.1:3400 (webtasarimajansi-web). Sertifika: /etc/letsencrypt/live/webtasarimajansi.net
server {
    listen 80;
    listen [::]:80;
    server_name webtasarimajansi.net www.webtasarimajansi.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/webtasarimajansi-acme; default_type text/plain; }
    location / { return 301 https://webtasarimajansi.net$request_uri; }
}

server {
    # Sunucudaki diğer sitelerle aynı: Nginx 1.24'te "http2" port düzeyinde bir seçenektir;
    # burada açılsa aynı 443 portundaki diğer sitelerin de davranışı değişirdi. ipv6only
    # gibi soket seçenekleri de burada tekrarlanmaz (başka bir blokta tanımlı).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.webtasarimajansi.net;
    ssl_certificate     /etc/letsencrypt/live/webtasarimajansi.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtasarimajansi.net/privkey.pem;
    return 301 https://webtasarimajansi.net$request_uri;
}

server {
    # Sunucudaki diğer sitelerle aynı: Nginx 1.24'te "http2" port düzeyinde bir seçenektir;
    # burada açılsa aynı 443 portundaki diğer sitelerin de davranışı değişirdi. ipv6only
    # gibi soket seçenekleri de burada tekrarlanmaz (başka bir blokta tanımlı).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webtasarimajansi.net;
    ssl_certificate     /etc/letsencrypt/live/webtasarimajansi.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtasarimajansi.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:webtasarimajansi_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    access_log /var/log/nginx/webtasarimajansi.access.log;
    error_log  /var/log/nginx/webtasarimajansi.error.log;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
